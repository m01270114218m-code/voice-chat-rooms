<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bgGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="150" fill="#3B82F6" opacity="0.1"/>
  <circle cx="1340" cy="800" r="200" fill="#3B82F6" opacity="0.1"/>
  
  <!-- Header/Navigation -->
  <rect width="1440" height="80" fill="#0F172A" opacity="0.8"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
  
  <!-- Logo -->
  <circle cx="60" cy="40" r="25" fill="#3B82F6"/>
  <text x="60" y="50" font-size="24" fill="white" text-anchor="middle" font-weight="bold">🎙️</text>
  
  <text x="100" y="50" font-size="22" fill="white" font-weight="bold">VoiceHub</text>
  
  <!-- Navigation Links -->
  <text x="400" y="50" font-size="14" fill="#94A3B8" font-family="Arial">Home</text>
  <text x="500" y="50" font-size="14" fill="#94A3B8" font-family="Arial">Features</text>
  <text x="620" y="50" font-size="14" fill="#94A3B8" font-family="Arial">About</text>
  
  <!-- Login Button -->
  <rect x="1250" y="25" width="140" height="50" rx="8" fill="url(#buttonGradient)" filter="url(#shadow)"/>
  <text x="1320" y="55" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Sign In</text>
  
  <!-- Main Content -->
  <!-- Hero Title -->
  <text x="720" y="180" font-size="64" fill="white" text-anchor="middle" font-weight="bold">غرف دردشة صوتية</text>
  <text x="720" y="240" font-size="64" fill="white" text-anchor="middle" font-weight="bold">احترافية وآمنة</text>
  
  <!-- Hero Subtitle -->
  <text x="720" y="310" font-size="18" fill="#CBD5E1" text-anchor="middle" font-family="Arial">تواصل صوتي فوري مع جودة عالية وأمان كامل</text>
  <text x="720" y="340" font-size="18" fill="#CBD5E1" text-anchor="middle" font-family="Arial">أنشئ غرفتك الخاصة والبدء في الدردشة الآن</text>
  
  <!-- CTA Buttons -->
  <!-- Create Room Button -->
  <rect x="520" y="420" width="180" height="60" rx="10" fill="url(#buttonGradient)" filter="url(#shadow)"/>
  <text x="610" y="455" font-size="16" fill="white" text-anchor="middle" font-weight="bold">إنشاء غرفة</text>
  
  <!-- Join Room Button -->
  <rect x="740" y="420" width="180" height="60" rx="10" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <text x="830" y="455" font-size="16" fill="#3B82F6" text-anchor="middle" font-weight="bold">الانضمام لغرفة</text>
  
  <!-- Features Section -->
  <text x="720" y="580" font-size="32" fill="white" text-anchor="middle" font-weight="bold">المميزات الرئيسية</text>
  
  <!-- Feature 1: Audio Quality -->
  <circle cx="250" cy="700" r="50" fill="#3B82F6" opacity="0.2"/>
  <text x="250" y="710" font-size="30" text-anchor="middle">🎵</text>
  <text x="250" y="760" font-size="14" fill="white" text-anchor="middle" font-weight="bold">جودة صوت عالية</text>
  
  <!-- Feature 2: Security -->
  <circle cx="720" cy="700" r="50" fill="#3B82F6" opacity="0.2"/>
  <text x="720" y="710" font-size="30" text-anchor="middle">🔒</text>
  <text x="720" y="760" font-size="14" fill="white" text-anchor="middle" font-weight="bold">تشفير آمن</text>
  
  <!-- Feature 3: Easy to Use -->
  <circle cx="1190" cy="700" r="50" fill="#3B82F6" opacity="0.2"/>
  <text x="1190" y="710" font-size="30" text-anchor="middle">⚡</text>
  <text x="1190" y="760" font-size="14" fill="white" text-anchor="middle" font-weight="bold">سهل الاستخدام</text>
</svg>